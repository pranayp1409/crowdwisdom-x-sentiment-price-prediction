[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cwt-sentiment-agent"
version = "0.1.0"
description = "An X sentiment and price forecasting research pipeline"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "python-dotenv>=1.0",
  "plotly>=5.18",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "streamlit>=1.35",
  "vaderSentiment>=3.3.2",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cwt-agent = "cwt_agent.cli:main"
cwt-dashboard = "cwt_agent.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
